<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slicer — slides from video</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'>%20<rect%20width='100'%20height='100'%20rx='20'%20fill='%230e0d0c'/>%20<rect%20x='20'%20y='28'%20width='60'%20height='44'%20rx='7'%20fill='none'%20stroke='%23ff6a1a'%20stroke-width='7'/>%20<path%20d='M40%2028%20V72%20M60%2028%20V72'%20stroke='%23ff6a1a'%20stroke-width='6'/>%20</svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0c; --panel:#171513; --line:#2c2824; --text:#ece6de;
  --muted:#8f877d; --accent:#ff6a1a; --accent-dim:#5a2a10;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--mono);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:48px 20px 64px;position:relative}
header{text-align:center;margin:0 auto 36px}
.kicker{display:block;text-align:center;color:var(--accent);font-size:12px;letter-spacing:.18em;margin-bottom:18px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(36px,7vw,68px);line-height:.85;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:14px auto 0;max-width:46ch}
.lang{position:absolute;top:48px;right:20px;z-index:20;display:flex;height:36px;align-items:stretch;flex-shrink:0;
  background:#151412;border:1px solid #2a2724;border-radius:999px;padding:3px}
.lang button{display:flex;align-items:center;background:none;border:0;color:var(--muted);font:400 11px var(--mono);
  letter-spacing:.1em;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--accent);color:#120a04;font-weight:700}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.drop{display:block;border:1px solid var(--line);border-radius:18px;padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#1a1411}
.drop strong{display:block;font-family:var(--serif);font-weight:400;font-size:30px;margin-bottom:6px;color:var(--accent)}
.drop span{color:var(--muted);font-size:12px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

.work{display:none;margin-top:28px}
.work.on{display:block}
.file{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:26px}
.file .name{font-family:var(--serif);font-size:26px;word-break:break-all}
.meta{color:var(--muted);font-size:12px}
.change{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.row{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;align-items:center;margin-bottom:14px}
.row > label{color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{width:100%;text-align:center;white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;padding:10px 8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.seg.big button{font-family:var(--serif);font-size:24px;padding:6px 22px}
.num{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font:13px var(--mono);padding:10px 12px}
.num:focus{outline:none;border-color:var(--accent)}
.q{display:flex;align-items:center;gap:14px}
.q input{flex:1;min-width:0;accent-color:var(--accent)}
.q b{font-weight:400;min-width:3ch;text-align:right}
.hide{display:none!important}
.est{color:var(--muted);font-size:12px;margin:6px 0 0}
.est.warn{color:var(--accent)}

.go{margin-top:22px;width:100%;background:var(--accent);color:#140a04;border:0;border-radius:10px;font:600 15px var(--mono);padding:16px;cursor:pointer}
.go:disabled{background:var(--accent-dim);color:#b98c70;cursor:default}
.go.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.bar{height:3px;background:var(--line);margin-top:12px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.status{min-height:1.5em;margin-top:10px;color:var(--muted);font-size:12px}
.status.err{color:#ff8a7a}

.result{display:none;margin-top:26px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.result.on{display:block}
.trim{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.trim .links{display:flex;gap:16px}
.frames{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.card{position:relative;flex:0 0 calc(50% - 5px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.card.off{opacity:.38}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;cursor:pointer}
.probe{position:fixed;left:0;top:0;width:64px;height:64px;opacity:.02;pointer-events:none;z-index:-1}
.card .cap{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:11px;color:var(--muted)}
.card .cap a{color:var(--accent);text-decoration:none}
.card .tick{position:absolute;top:6px;left:6px;width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
@media (min-width:640px){.card{flex-basis:calc(25% - 7.5px)}}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--mono);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:border-color .15s,color .15s}
.back-link:hover{border-color:var(--accent);color:var(--text)}
.back-row{display:flex;justify-content:space-between;align-items:center;margin-top:40px;gap:12px}
.signature{margin-top:24px;text-align:center;color:var(--muted);font-size:12px}
.signature i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;font-style:normal}
.signature i.right{margin-right:0;margin-left:8px}
button:focus-visible,.drop:focus-within,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:520px){
  main{padding-top:76px}
  .row{grid-template-columns:1fr;gap:6px}
  .lang{top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <span class="kicker" data-i18n="kicker"></span>
      <h1>Slicer</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru" class="on">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*,.mp4,.mov,.m4v,.mkv,.webm,.avi,.3gp">
    <strong data-i18n="dropTitle"></strong>
    <span data-i18n="dropHint"></span>
  </label>

  <section class="work" id="work">
    <div class="file">
      <div>
        <div class="name" id="fname"></div>
        <div class="meta" id="fmeta"></div>
      </div>
      <button class="change" id="change" data-i18n="change"></button>
    </div>

    <div class="row">
      <label data-i18n="interval"></label>
      <div class="seg" data-key="interval">
        <button data-v="2" aria-pressed="false" data-i18n="s2"></button>
        <button data-v="5" aria-pressed="true" data-i18n="s5"></button>
        <button data-v="10" aria-pressed="false" data-i18n="s10"></button>
        <button data-v="custom" aria-pressed="false" data-i18n="custom"></button>
      </div>
    </div>
    <div class="row hide" id="rowCustom">
      <label data-i18n="customLabel"></label>
      <input class="num" id="customIv" type="number" min="0.5" step="0.5" value="3" inputmode="decimal">
    </div>
    <div class="row">
      <label data-i18n="format"></label>
      <div class="seg big" data-key="format">
        <button data-v="png" aria-pressed="true">PNG</button>
        <button data-v="jpg" aria-pressed="false">JPG</button>
      </div>
    </div>
    <div class="row hide" id="rowQ">
      <label data-i18n="quality"></label>
      <div class="q"><input type="range" id="q" min="50" max="100" value="90"><b id="qVal">90</b></div>
    </div>
    <div class="row">
      <label data-i18n="size"></label>
      <div class="seg three" data-key="maxH">
        <button data-v="0" aria-pressed="true" data-i18n="orig"></button>
        <button data-v="1080" aria-pressed="false">1080p</button>
        <button data-v="720" aria-pressed="false">720p</button>
      </div>
    </div>
    <div class="est" id="est"></div>

    <button class="go" id="go" data-i18n="slice" disabled></button>
    <button class="go ghost hide" id="stop" data-i18n="stop"></button>
    <div class="bar"><i id="prog"></i></div>
    <div class="status" id="status" role="status"></div>

    <div class="result" id="result">
      <div class="trim">
        <span id="count"></span>
        <span class="links">
          <button class="change" id="all" data-i18n="all"></button>
          <button class="change" id="none" data-i18n="none"></button>
        </span>
      </div>
      <div class="frames" id="grid"></div>
      <button class="go" id="zip" data-i18n="zip"></button>
    </div>
  </section>

  <div class="back-row">
    <a class="back-link" href="https://github.com/imBeyondiDentity/Slicer" target="_blank" rel="noopener">GitHub</a>
    <a class="back-link" href="mailto:imbeyondidentity@gmail.com" data-i18n="contact"></a>
  </div>
  <div class="signature"><i></i>Slicer<i class="right"></i></div>
</main>

<script>
"use strict";

/* ---------- Translations ---------- */
const T = {
  ru: {
    kicker: "СЛАЙДЫ ИЗ ВИДЕО",
    contact: "Написать",
    sub: "Снимает кадры с видео через равные промежутки. Всё происходит в браузере — файл никуда не загружается.",
    dropTitle: "Перетащи видео сюда",
    dropHint: "или нажми и выбери · MP4, MOV, WEBM и другие",
    change: "Выбрать другой файл",
    interval: "Интервал", s2: "2 с", s5: "5 с", s10: "10 с", custom: "Свой",
    customLabel: "Свой интервал, с",
    format: "Формат", quality: "Качество", size: "Размер", orig: "Оригинал",
    est: n => "Кадров: примерно " + n,
    warn: "Кадров очень много — браузеру может не хватить памяти. Для длинных видео надёжнее Python-версия.",
    slice: "Нарезать", stop: "Стоп",
    reading: "Читаю видео…",
    prog: (a, b) => "Нарезка " + a + " / " + b,
    done: n => "Готово · кадров: " + n,
    all: "Выбрать все", none: "Снять все", zip: "Скачать ZIP",
    count: (a, b) => "Выбрано: " + a + " / " + b,
    meta: (d, w, h, s) => d + "  ·  " + w + "×" + h + "  ·  " + s,
    readErr: "Браузер не смог прочитать это видео. Попробуй Chrome или Safari. Python-версия читает любые форматы через ffmpeg.",
    seekErr: "Перемотка перестала отвечать. Попробуй видео покороче или Python-версию."
  },
  en: {
    kicker: "VIDEO SLIDES",
    contact: "Contact",
    sub: "Slices frames out of a video at a fixed interval. Everything runs in your browser — the file is never uploaded.",
    dropTitle: "Drop a video here",
    dropHint: "or click to choose · MP4, MOV, WEBM and more",
    change: "Choose another file",
    interval: "Interval", s2: "2 s", s5: "5 s", s10: "10 s", custom: "Custom",
    customLabel: "Custom interval, s",
    format: "Format", quality: "Quality", size: "Size", orig: "Original",
    est: n => "Frames: about " + n,
    warn: "That is a lot of frames — the browser may run out of memory. For long videos the Python version is more reliable.",
    slice: "Slice", stop: "Stop",
    reading: "Reading the video…",
    prog: (a, b) => "Slicing " + a + " / " + b,
    done: n => "Done · " + n + " frames",
    all: "Select all", none: "Select none", zip: "Download ZIP",
    count: (a, b) => "Selected: " + a + " / " + b,
    meta: (d, w, h, s) => d + "  ·  " + w + "×" + h + "  ·  " + s,
    readErr: "The browser couldn't read this video. Try Chrome or Safari. The Python version reads any format via ffmpeg.",
    seekErr: "Seeking stopped responding. Try a shorter video or the Python version."
  }
};
let lang = "ru";
try {
  lang = localStorage.getItem("slicer_lang") ||
    ((navigator.language || "ru").startsWith("ru") ? "ru" : "en");
} catch (e) {}
const t = k => T[lang][k];
const $ = s => document.querySelector(s);

/* ---------- State ---------- */
const S = {
  file: null, url: null, video: null, ready: false,
  duration: 0, w: 0, h: 0,
  interval: 5, format: "png", quality: 0.9, maxH: 0,
  frames: [], running: false, cancel: false, msg: null
};

/* ---------- Helpers ---------- */
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? h + ":" + p(m) + ":" + p(s) : m + ":" + p(s);
}
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.ceil(b / 1024) + " KB"; }
function stamp(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2, "0") + "m" + String(s).padStart(2, "0") + "s";
}
function baseName(name) { return name.replace(/\.[^.]+$/, "").replace(/[^\w.\-]+/g, "_") || "video"; }
function currentInterval() {
  if (S.interval === "custom") {
    const v = parseFloat($("#customIv").value);
    return isFinite(v) && v >= 0.5 ? v : 0.5;
  }
  return S.interval;
}
function frameCount() {
  return S.duration ? Math.floor((S.duration - 0.001) / currentInterval()) + 1 : 0;
}
function outSize() {
  let w = S.w, h = S.h;
  if (S.maxH && h > S.maxH) { w = Math.round(w * S.maxH / h); h = S.maxH; }
  return { w: w + (w % 2), h: h + (h % 2) };
}

/* ---------- Text that depends on language or state ---------- */
function setMsg(fn, err) {
  S.msg = fn ? { fn: fn, err: !!err } : null;
  renderDynamic();
}
function renderDynamic() {
  if (S.file && S.ready) {
    $("#fmeta").textContent = t("meta")(fmtTime(S.duration), S.w, S.h, fmtSize(S.file.size));
    const n = frameCount();
    $("#est").textContent = t("est")(n);
    $("#est").classList.toggle("warn", n > 600);
    if (n > 600) $("#est").textContent += " · " + t("warn");
  } else {
    $("#fmeta").textContent = ""; $("#est").textContent = "";
  }
  $("#count").textContent = t("count")(S.frames.filter(f => f.checked).length, S.frames.length);
  const st = $("#status");
  st.textContent = S.msg ? S.msg.fn() : "";
  st.classList.toggle("err", !!(S.msg && S.msg.err));
  $("#go").disabled = !S.ready || S.running;
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  renderDynamic();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("slicer_lang", lang); } catch (e) {}
  applyLang();
});

/* ---------- Loading a video ---------- */
const drop = $("#drop"), input = $("#file");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
input.addEventListener("change", () => { if (input.files[0]) load(input.files[0]); });
$("#change").onclick = () => input.click();

function load(file) {
  if (S.running) return;
  clearFrames();
  if (S.url) URL.revokeObjectURL(S.url);
  S.file = file; S.ready = false; S.video = null;
  $("#work").classList.add("on");
  $("#fname").textContent = file.name;
  setMsg(() => t("reading"));

  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto";
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
  v.className = "probe";
  document.querySelectorAll("video.probe").forEach(x => x.remove());
  document.body.appendChild(v);
  S.url = URL.createObjectURL(file);
  v.src = S.url;
  v.onloadedmetadata = () => {
    if (S.file !== file) return;
    S.video = v; S.duration = v.duration; S.w = v.videoWidth; S.h = v.videoHeight;
    if (!isFinite(S.duration) || !S.w) { setMsg(() => t("readErr"), true); return; }
    S.ready = true;
    setMsg(null);
  };
  v.onerror = () => { if (S.file === file) { S.ready = false; setMsg(() => t("readErr"), true); } };
}

/* ---------- Seeking and drawing ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const twoFrames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
function waitSeeked(v, ms) {
  return new Promise((resolve, reject) => {
    let timer;
    const finish = () => { clearTimeout(timer); v.removeEventListener("seeked", finish); resolve(); };
    timer = setTimeout(() => { v.removeEventListener("seeked", finish); reject(new Error("seek")); }, ms);
    v.addEventListener("seeked", finish);
  });
}
// Resolves when the browser has painted a new video frame (or after ms).
function nextFrame(v, ms) {
  return new Promise(resolve => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(fin);
    setTimeout(fin, ms);
  });
}
// "seeked" can fire before the new picture is ready, so also wait for
// a painted frame, two animation frames and a short extra pause.
async function seekTo(v, time, extra) {
  if (Math.abs(v.currentTime - time) < 0.01 && v.readyState >= 2) {
    await twoFrames(); await sleep(extra); return;
  }
  for (let attempt = 0; attempt < 2; attempt++) {
    const target = attempt ? Math.min(time + 0.02, v.duration - 0.001) : time;
    const seeked = waitSeeked(v, 8000);
    const painted = nextFrame(v, 1500);
    v.currentTime = target;
    try {
      await seeked; await painted; await twoFrames(); await sleep(extra);
      return;
    } catch (e) { if (attempt) throw e; }
  }
}
// Mobile Safari only decodes a video after it has been played once.
async function kickStart(v) {
  try { await Promise.race([v.play(), sleep(3000)]); } catch (e) {}
  v.pause();
}
const probeCanvas = document.createElement("canvas");
probeCanvas.width = probeCanvas.height = 32;
function pixels(canvas) {
  const g = probeCanvas.getContext("2d", { willReadFrequently: true });
  g.drawImage(canvas, 0, 0, 32, 32);
  return g.getImageData(0, 0, 32, 32).data;
}
function looksBlank(canvas) {
  const d = pixels(canvas);
  for (let i = 0; i < d.length; i += 4) if (d[i] > 12 || d[i + 1] > 12 || d[i + 2] > 12) return false;
  return true;
}
function signature(canvas) {
  const d = pixels(canvas);
  let h = 2166136261;
  for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const toBlob = (canvas, mime, q) => new Promise(r => canvas.toBlob(r, mime, q));
function setProg(p) { $("#prog").style.width = (Math.max(0, Math.min(1, p)) * 100) + "%"; }

async function run() {
  if (!S.ready || S.running) return;
  clearFrames();
  S.running = true; S.cancel = false;
  $("#go").classList.add("hide"); $("#stop").classList.remove("hide");
  setProg(0);
  await kickStart(S.video);

  const iv = currentInterval(), total = frameCount(), size = outSize();
  const canvas = document.createElement("canvas");
  canvas.width = size.w; canvas.height = size.h;
  const ctx = canvas.getContext("2d");
  const mime = S.format === "png" ? "image/png" : "image/jpeg";
  const base = baseName(S.file.name);

  let extra = 60, prevSig = null, staticSeen = false;
  try {
    for (let i = 0; i < total; i++) {
      if (S.cancel) break;
      const time = i * iv;
      await seekTo(S.video, time, extra);
      ctx.drawImage(S.video, 0, 0, size.w, size.h);
      for (let k = 0; k < 2 && looksBlank(canvas); k++) {
        await new Promise(r => setTimeout(r, 250 + k * 350));
        ctx.drawImage(S.video, 0, 0, size.w, size.h);
      }
      // A frame identical to the previous one is either a still scene or a
      // stale picture. Check once: if waiting longer changes it, wait longer
      // for every frame from now on; if not, the scene really is still.
      let sig = signature(canvas);
      if (prevSig !== null && sig === prevSig && !staticSeen) {
        await sleep(800);
        ctx.drawImage(S.video, 0, 0, size.w, size.h);
        const sig2 = signature(canvas);
        if (sig2 !== sig) extra = 800; else staticSeen = true;
        sig = sig2;
      }
      prevSig = sig;
      const blob = await toBlob(canvas, mime, S.quality);
      if (!blob) continue;
      addFrame({
        time: time, blob: blob, checked: true, url: URL.createObjectURL(blob),
        ratio: size.w + " / " + size.h,
        name: base + "_" + String(i + 1).padStart(4, "0") + "_" + stamp(time) + "." + S.format
      });
      setProg((i + 1) / total);
      setMsg(() => t("prog")(i + 1, total));
    }
    const n = S.frames.length;
    if (!S.cancel) setMsg(() => t("done")(n));
  } catch (e) {
    setMsg(() => t("seekErr"), true);
  }
  S.running = false;
  $("#go").classList.remove("hide"); $("#stop").classList.add("hide");
  renderDynamic();
}

/* ---------- Frame cards ---------- */
function addFrame(f) {
  S.frames.push(f);
  $("#result").classList.add("on");
  const card = document.createElement("div");
  card.className = "card";
  const tick = document.createElement("input");
  tick.type = "checkbox"; tick.className = "tick"; tick.checked = true;
  const img = document.createElement("img");
  img.src = f.url; img.alt = f.name; img.loading = "lazy";
  img.style.aspectRatio = f.ratio;
  const cap = document.createElement("div");
  cap.className = "cap";
  const time = document.createElement("span");
  time.textContent = fmtTime(f.time);
  const dl = document.createElement("a");
  dl.href = f.url; dl.download = f.name; dl.textContent = "↓";
  cap.append(time, dl);
  card.append(tick, img, cap);
  $("#grid").appendChild(card);
  f.card = card; f.tick = tick;
  const toggle = () => { f.checked = tick.checked; card.classList.toggle("off", !f.checked); renderDynamic(); };
  tick.addEventListener("change", toggle);
  img.addEventListener("click", () => { tick.checked = !tick.checked; toggle(); });
}
function clearFrames() {
  S.frames.forEach(f => URL.revokeObjectURL(f.url));
  S.frames = [];
  $("#grid").innerHTML = "";
  $("#result").classList.remove("on");
  setProg(0);
  S.msg = null;
  renderDynamic();
}
function setAll(on) {
  S.frames.forEach(f => { f.checked = on; f.tick.checked = on; f.card.classList.toggle("off", !on); });
  renderDynamic();
}

/* ZIP-START */
/* ---------- Minimal ZIP writer (store only, no compression) ---------- */
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosDateTime(d) {
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
  };
}
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const dt = dosDateTime(new Date());
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.bytes), size = f.bytes.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     lh.setUint16(8, 0, true);
    lh.setUint16(10, dt.time, true);   lh.setUint16(12, dt.date, true);
    lh.setUint32(14, crc, true);       lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);      lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.bytes);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);         ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);         ch.setUint16(12, dt.time, true);
    ch.setUint16(14, dt.date, true);   ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);      ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);

    offset += 30 + name.length + size;
  }
  let cdSize = 0;
  for (const p of central) cdSize += p.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(4, 0, true);  end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);      end.setUint32(16, offset, true);
  end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
/* ZIP-END */

async function downloadZip() {
  const chosen = S.frames.filter(f => f.checked);
  if (!chosen.length) return;
  const btn = $("#zip");
  btn.disabled = true;
  try {
    const files = [];
    for (const f of chosen) files.push({ name: f.name, bytes: new Uint8Array(await f.blob.arrayBuffer()) });
    const url = URL.createObjectURL(makeZip(files));
    const a = document.createElement("a");
    a.href = url; a.download = baseName(S.file.name) + "_slides.zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- Controls ---------- */
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const k = seg.dataset.key, v = b.dataset.v;
    if (k === "interval") S.interval = v === "custom" ? "custom" : Number(v);
    else if (k === "format") S.format = v;
    else if (k === "maxH") S.maxH = Number(v);
    $("#rowCustom").classList.toggle("hide", S.interval !== "custom");
    $("#rowQ").classList.toggle("hide", S.format !== "jpg");
    renderDynamic();
  });
});
$("#customIv").addEventListener("input", renderDynamic);
$("#q").addEventListener("input", e => {
  $("#qVal").textContent = e.target.value;
  S.quality = e.target.value / 100;
});
$("#go").onclick = run;
$("#stop").onclick = () => { S.cancel = true; };
$("#all").onclick = () => setAll(true);
$("#none").onclick = () => setAll(false);
$("#zip").onclick = downloadZip;

applyLang();
</script>
